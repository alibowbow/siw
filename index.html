<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>시원스쿨 패턴 중국어 오디오 플레이어</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    /* 트랙마다 바뀌는 색상(hue). 등록해 두면 색이 부드럽게 이어서 변한다. */
    @property --h {
      syntax: "<number>";
      inherits: true;
      initial-value: 280;
    }

    :root {
      --h: 280;
      --bg: #07070d;
      --text: rgba(255, 255, 255, 0.96);
      --text-2: rgba(255, 255, 255, 0.64);
      --text-3: rgba(255, 255, 255, 0.4);
      --accent: oklch(0.8 0.14 var(--h));
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --r-xl: 32px;
      color-scheme: dark;
      transition: --h 1.1s var(--ease);
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard Variable", Pretendard, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; }

    :focus-visible {
      outline: 2px solid oklch(0.85 0.14 var(--h));
      outline-offset: 3px;
    }

    /* ---------- 배경: 흐르는 오로라 + 그레인 ---------- */
    .aurora {
      position: fixed;
      inset: -20vmax;
      z-index: -2;
      pointer-events: none;
      opacity: 0.7;
      transition: opacity 1.2s var(--ease);
    }

    body.is-playing .aurora { opacity: 1; }

    .blob {
      position: absolute;
      width: 75vmax;
      height: 75vmax;
      border-radius: 50%;
      will-change: transform;
    }

    .b1 {
      top: 0;
      left: 0;
      background: radial-gradient(closest-side, oklch(0.58 0.2 var(--h) / 0.6), transparent);
      animation: drift1 26s ease-in-out infinite alternate;
    }

    .b2 {
      top: 12vmax;
      right: 0;
      background: radial-gradient(closest-side, oklch(0.52 0.2 calc(var(--h) + 60) / 0.45), transparent);
      animation: drift2 32s ease-in-out infinite alternate;
    }

    .b3 {
      bottom: 0;
      left: 18vmax;
      background: radial-gradient(closest-side, oklch(0.46 0.18 calc(var(--h) - 50) / 0.42), transparent);
      animation: drift3 38s ease-in-out infinite alternate;
    }

    @keyframes drift1 { to { transform: translate(20vmax, 14vmax) scale(1.15); } }
    @keyframes drift2 { to { transform: translate(-18vmax, 16vmax) scale(0.9); } }
    @keyframes drift3 { to { transform: translate(10vmax, -20vmax) scale(1.2); } }

    .grain {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.55'/></svg>"),
        linear-gradient(180deg, rgba(7, 7, 13, 0) 30%, rgba(7, 7, 13, 0.55) 100%);
      opacity: 0.5;
      mix-blend-mode: overlay;
    }

    /* ---------- 리퀴드 글래스 ---------- */
    .glass {
      position: relative;
      border-radius: var(--r-xl);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04) 42%, rgba(255, 255, 255, 0.07));
      -webkit-backdrop-filter: blur(28px) saturate(170%);
      backdrop-filter: blur(28px) saturate(170%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 -1px 0 rgba(255, 255, 255, 0.04),
        0 30px 60px -24px rgba(0, 0, 0, 0.6);
    }

    /* 빛을 받은 유리 테두리 */
    .glass::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.06) 32%, rgba(255, 255, 255, 0) 62%, rgba(255, 255, 255, 0.2));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass { background: rgba(28, 28, 40, 0.92); }
    }

    /* ---------- 레이아웃 ---------- */
    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 112px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding: 8px 14px 8px 8px;
      border-radius: 999px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      flex: none;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      background: linear-gradient(145deg, oklch(0.8 0.14 var(--h)), oklch(0.5 0.2 calc(var(--h) + 50)));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 8px 20px -8px oklch(0.6 0.2 var(--h) / 0.9);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      margin-top: 1px;
      color: var(--text-3);
      font-size: 12px;
    }

    .progress-summary {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: none;
    }

    .ring {
      width: 36px;
      height: 36px;
      transform: rotate(-90deg);
    }

    .ring circle {
      fill: none;
      stroke-width: 3.5;
    }

    .ring-bg { stroke: rgba(255, 255, 255, 0.12); }

    .ring-fg {
      stroke: var(--accent);
      stroke-linecap: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      transition: stroke-dashoffset 0.9s var(--ease);
    }

    .ps-num {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .ps-num span {
      color: var(--text-3);
      font-weight: 500;
    }

    .ps-label {
      color: var(--text-3);
      font-size: 11px;
    }

    .layout > * + * { margin-top: 16px; }

    /* ---------- 현재 재생 ---------- */
    .now { padding: 22px 20px 20px; }

    .art-stage {
      position: relative;
      display: grid;
      place-items: center;
      padding: 4px 0 22px;
    }

    .art-glow {
      position: absolute;
      width: min(80%, 280px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: oklch(0.65 0.2 var(--h));
      filter: blur(48px);
      opacity: 0.35;
      transform: scale(0.8);
      transition: opacity 0.8s var(--ease), transform 0.8s var(--ease);
    }

    body.is-playing .art-glow {
      opacity: 0.6;
      animation: breathe 4.2s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.95); }
      50% { transform: scale(1.08); }
    }

    .art {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: min(100%, 340px, max(180px, 100vh - 470px));
      width: min(100%, 340px, max(180px, 100dvh - 470px));
      aspect-ratio: 1;
      padding: 22px 24px;
      container-type: inline-size;
      overflow: hidden;
      border-radius: 30px;
      color: #fff;
      background:
        radial-gradient(120% 90% at 12% 6%, oklch(0.88 0.11 calc(var(--h) + 30)) 0%, transparent 55%),
        radial-gradient(100% 100% at 95% 100%, oklch(0.4 0.19 calc(var(--h) - 40)) 0%, transparent 62%),
        linear-gradient(145deg, oklch(0.74 0.17 var(--h)), oklch(0.44 0.18 calc(var(--h) + 50)));
      box-shadow:
        0 34px 70px -26px oklch(0.55 0.22 var(--h) / 0.85),
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      transform: scale(0.86);
      transition: transform 0.75s var(--spring);
    }

    body.is-playing .art { transform: scale(1); }

    .art::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(155deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0) 38%),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.6'/></svg>");
      mix-blend-mode: soft-light;
    }

    .sheen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.45) 50%, transparent 65%);
      transform: translateX(-130%);
    }

    .art.sheen-run .sheen { animation: sheen 1.1s var(--ease); }

    @keyframes sheen { to { transform: translateX(130%); } }

    .art-top,
    .art-bottom {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      white-space: nowrap;
    }

    .art-top span:first-child,
    .art-bottom span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 네모가 작아져도 글자가 줄바꿈되지 않게 네모 크기에 맞춰 줄인다 */
    .art-top {
      font-size: 12px;
      font-size: clamp(9px, 4.1cqw, 12px);
      font-weight: 700;
      letter-spacing: 0.18em;
      opacity: 0.88;
    }

    .art-bottom {
      font-size: 13px;
      font-size: clamp(9px, 4.5cqw, 13px);
      font-weight: 600;
      opacity: 0.88;
      font-variant-numeric: tabular-nums;
    }

    .art-num {
      position: relative;
      z-index: 1;
      display: flex;
      font-size: 120px;
      font-size: 51cqw;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.06em;
      font-variant-numeric: tabular-nums;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.16));
    }

    /* 숫자가 굴러가는 오도미터 */
    .slot {
      display: inline-block;
      height: 1em;
      overflow: hidden;
      transition: opacity 0.5s var(--ease);
    }

    .slot.dim { opacity: 0.28; }

    .reel {
      display: flex;
      flex-direction: column;
      transition: transform 0.8s cubic-bezier(0.2, 1.25, 0.3, 1);
    }

    .reel span {
      display: block;
      height: 1em;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .meta { min-width: 0; }

    .track-title {
      margin: 0;
      font-size: 23px;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .track-sub {
      margin: 3px 0 0;
      color: var(--text-2);
      font-size: 14px;
    }

    .icon-btn {
      flex: none;
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      color: var(--text-2);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: transform 0.45s var(--spring), background 0.3s, color 0.3s;
    }

    .icon-btn:hover { background: rgba(255, 255, 255, 0.13); }
    .icon-btn:active { transform: scale(0.86); }

    .icon-btn svg {
      width: 22px;
      height: 22px;
    }

    .fav[aria-pressed="true"] {
      color: oklch(0.88 0.15 var(--h));
      background: oklch(0.7 0.15 var(--h) / 0.22);
    }

    .fav[aria-pressed="true"] svg { fill: currentColor; }
    .fav.pop svg { animation: pop 0.55s var(--spring); }

    @keyframes pop {
      0% { transform: scale(0.6) rotate(-20deg); }
      100% { transform: scale(1) rotate(0); }
    }

    /* 진행바 */
    .scrubber {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
      cursor: pointer;
      touch-action: none;
    }

    .scrub-track {
      position: relative;
      width: 100%;
      height: 6px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.14);
      transition: height 0.25s var(--ease);
    }

    .scrubber:hover .scrub-track,
    .scrubber.dragging .scrub-track,
    .scrubber:focus-visible .scrub-track { height: 11px; }

    .scrub-fill,
    .mini-progress i {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, oklch(0.76 0.15 var(--h)), oklch(0.94 0.07 calc(var(--h) + 30)));
      transform: scaleX(0);
      transform-origin: left center;
    }

    .times {
      display: flex;
      justify-content: space-between;
      color: var(--text-3);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 12px;
    }

    .transport {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 7vw, 40px);
    }

    .t-btn {
      position: relative;
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      border: 0;
      border-radius: 50%;
      color: var(--text);
      background: transparent;
      cursor: pointer;
      transition: transform 0.45s var(--spring), background 0.25s, opacity 0.25s;
    }

    .t-btn:hover { background: rgba(255, 255, 255, 0.07); }
    .t-btn:active { transform: scale(0.82); }
    .t-btn:disabled { opacity: 0.3; cursor: default; }

    .t-btn svg {
      width: 34px;
      height: 34px;
    }

    .t-btn.play {
      width: 84px;
      height: 84px;
      color: #fff;
      background: radial-gradient(120% 120% at 30% 18%, oklch(0.86 0.12 var(--h) / 0.8), oklch(0.62 0.2 var(--h) / 0.6) 55%, oklch(0.45 0.2 calc(var(--h) + 40) / 0.65));
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.6),
        inset 0 -8px 16px rgba(0, 0, 0, 0.16),
        inset 0 0 0 1px rgba(255, 255, 255, 0.2),
        0 20px 40px -14px oklch(0.6 0.22 var(--h) / 0.95);
    }

    .t-btn.play svg {
      grid-area: 1 / 1;
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.22));
      transition: transform 0.5s var(--spring), opacity 0.2s;
    }

    .i-pause {
      opacity: 0;
      transform: scale(0.4) rotate(-45deg);
    }

    body.is-playing .i-play {
      opacity: 0;
      transform: scale(0.4) rotate(45deg);
    }

    body.is-playing .i-pause {
      opacity: 1;
      transform: none;
    }

    .t-btn.play::after {
      content: "";
      position: absolute;
      inset: -6px;
      border: 2px solid transparent;
      border-top-color: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.2s;
    }

    body.is-loading .t-btn.play::after {
      opacity: 1;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .extras {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 40px;
      padding: 0 16px;
      border: 0;
      border-radius: 99px;
      color: var(--text-2);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      font-size: 13px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.45s var(--spring), background 0.3s, color 0.3s;
    }

    .chip:hover { background: rgba(255, 255, 255, 0.13); }
    .chip:active { transform: scale(0.9); }

    .chip svg {
      width: 17px;
      height: 17px;
    }

    .chip.on {
      color: oklch(0.92 0.09 var(--h));
      background: oklch(0.7 0.15 var(--h) / 0.24);
    }

    /* ---------- 패턴 목록 ---------- */
    .library { padding: 20px 16px; }

    .lib-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .lib-head h2 {
      margin: 0;
      font-size: 21px;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .lib-sub {
      margin: 3px 0 0;
      color: var(--text-3);
      font-size: 13px;
    }

    .link-btn {
      flex: none;
      padding: 6px 4px;
      border: 0;
      color: oklch(0.86 0.12 var(--h));
      background: none;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }

    .tabs {
      position: relative;
      display: flex;
      gap: 2px;
      margin-bottom: 16px;
      padding: 4px;
      overflow-x: auto;
      border-radius: 99px;
      background: rgba(0, 0, 0, 0.26);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab-indicator {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 0;
      width: 0;
      border-radius: 99px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 6px 16px -6px rgba(0, 0, 0, 0.6);
      transition: transform 0.55s var(--spring), width 0.55s var(--spring);
    }

    .tab {
      position: relative;
      z-index: 1;
      display: flex;
      flex: 1 0 auto;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 62px;
      padding: 8px 10px 9px;
      border: 0;
      border-radius: 99px;
      color: var(--text-3);
      background: none;
      font-size: 13px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.3s;
    }

    .tab[aria-selected="true"] { color: var(--text); }

    .tab-bar {
      width: 26px;
      height: 3px;
      overflow: hidden;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.12);
    }

    .tab-bar i {
      display: block;
      width: var(--p, 0%);
      height: 100%;
      background: var(--accent);
      transition: width 0.6s var(--ease);
    }

    .tab-fav .tab-bar { visibility: hidden; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
      gap: 8px;
    }

    .cell {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border: 0;
      border-radius: 16px;
      color: var(--text-2);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      cursor: pointer;
      animation: cell-in 0.5s var(--ease) backwards;
      animation-delay: calc(var(--i, 0) * 9ms);
      transition: transform 0.45s var(--spring), background 0.4s, box-shadow 0.4s, color 0.3s;
    }

    @keyframes cell-in {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.88);
      }
    }

    .cell:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px) scale(1.05);
    }

    .cell:active { transform: scale(0.88); }

    .cell-num {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      transition: transform 0.4s var(--spring);
    }

    /* 들은 횟수만큼 진해지는 잔디 */
    .cell[data-level="1"],

    body.is-playing .cell.current .eq i:nth-child(3) { animation-delay: -0.6s; }

      font-weight: 650;

    @media (hover: hover) and (pointer: fine) {
      .kbd-hint { display: block; }

    .mini {

      right: 12px;
      bottom: calc(env(safe-area-inset-bottom) + 12px);
      left: 12px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;

      opacity: 1;
      transform: none;

      .mini { bottom: calc(env(safe-area-inset-bottom) + 82px); }

      /* 아래 떠 있는 바 뒤로 목록이 비쳐도 글자가 잘 보이도록 */
      .mini,
      .viewbar {
        background: linear-gradient(160deg, rgba(54, 54, 72, 0.78), rgba(16, 16, 26, 0.82));
        -webkit-backdrop-filter: blur(30px) saturate(180%);
        backdrop-filter: blur(30px) saturate(180%);
      }

      .bottom-fade {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 15;
        display: block;
        height: calc(env(safe-area-inset-bottom) + 100px);

      .art {

    }

      .controls {
        grid-area: controls;
        margin-top: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

        get(key, fallback) {
          try {
            const raw = localStorage.getItem(key);
            return raw === null ? fallback : JSON.parse(raw);
          } catch {
            return fallback;
          }
        },
        set(key, value) {
          try {
            localStorage.setItem(key, JSON.stringify(value));
          } catch {
            /* 저장 불가 환경(사생활 보호 모드 등)에서는 무시 */
          }
        }
      };

      const clampTrack = (n) => Math.min(MAX_TRACK, Math.max(1, Math.round(Number(n)) || 1));
      const isTrack = (n) => Number.isInteger(n) && n >= 1 && n <= MAX_TRACK;
      const trackUrl = (n) => `${BASE_URL}${n}.mp3`;
      const hueOf = (n) => (280 + (n - 1) * 137.508) % 360;
      const rangeOf = (n) => Math.floor((n - 1) / RANGE_SIZE);
      const RANGES = Array.from({ length: Math.ceil(MAX_TRACK / RANGE_SIZE) }, (_, i) => [
        i * RANGE_SIZE + 1,
        Math.min(MAX_TRACK, (i + 1) * RANGE_SIZE)
      ]);
      const rangeLabel = (i) => `${RANGES[i][0]}–${RANGES[i][1]}`;

      function fmt(sec) {
        if (!Number.isFinite(sec) || sec < 0) sec = 0;
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${String(s).padStart(2, "0")}`;
      }

      function loadPlays() {
        const raw = store.get("siwon.plays", {});
        const plays = {};
        if (raw && typeof raw === "object") {
          for (const [k, v] of Object.entries(raw)) {
            const n = Number(k);
            if (isTrack(n) && Number(v) > 0) plays[n] = Math.floor(Number(v));
          }
        }
        return plays;
      }

      const savedSpeed = Number(store.get("siwon.speed", 1));
      const savedRepeat = store.get("siwon.repeat", null);
      const savedFavs = store.get("siwon.favs", []);
      const savedPos = store.get("siwon.position", null);

      const state = {
        current: clampTrack(store.get("siwon.current", 1)),
        speed: SPEEDS.includes(savedSpeed) ? savedSpeed : 1,
        // 예전 버전의 "연속 듣기 ON/OFF" 설정을 이어받는다
        repeat: REPEAT_MODES.includes(savedRepeat) ? savedRepeat : (store.get("siwon.continuous", true) ? "all" : "off"),
        plays: loadPlays(),
        favs: new Set(Array.isArray(savedFavs) ? savedFavs.map(Number).filter(isTrack) : []),
        tab: 0,
        view: store.get("siwon.view", "player") === "list" ? "list" : "player",
        listScroll: 0,
        hue: 280,
        dragging: false,
        dragTime: 0,
        pendingSeek: null,
        lastPosSave: 0
      };

      const $ = (id) => document.getElementById(id);
      const el = {
        audio: $("audio"),
        nowCard: $("nowCard"),
        library: $("library"),
        viewbar: $("viewbar"),
        art: $("art"),
        artNum: $("artNum"),
        artRange: $("artRange"),
        artPos: $("artPos"),
        trackTitle: $("trackTitle"),
        trackSub: $("trackSub"),
        favBtn: $("favBtn"),
        scrubber: $("scrubber"),
        scrubFill: $("scrubFill"),
        timeCur: $("timeCur"),
        timeRemain: $("timeRemain"),
        prevBtn: $("prevBtn"),
        playBtn: $("playBtn"),
        nextBtn: $("nextBtn"),
        speedBtn: $("speedBtn"),
        speedLabel: $("speedLabel"),
        repeatBtn: $("repeatBtn"),
        repeatIcon: $("repeatIcon"),
        repeatLabel: $("repeatLabel"),
        doneCount: $("doneCount"),
        ringFg: $("ringFg"),
        tabs: $("tabs"),
        grid: $("grid"),
        emptyFav: $("emptyFav"),
        locateBtn: $("locateBtn"),
        mini: $("mini"),
        miniArt: $("miniArt"),
        miniInfo: $("miniInfo"),
        miniTitle: $("miniTitle"),
        miniSub: $("miniSub"),
        miniPlay: $("miniPlay"),
        miniNext: $("miniNext"),
        miniFill: $("miniFill"),
        toast: $("toast"),
        themeColor: document.querySelector('meta[name="theme-color"]')
      };

      /* ---------- 공통 ---------- */
      let toastTimer = 0;
      function toast(message) {
        el.toast.textContent = message;
        el.toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.toast.classList.remove("show"), 2400);
      }

      function haptic(ms = 8) {
        try {
          if (navigator.vibrate) navigator.vibrate(ms);
        } catch {
          /* 진동 미지원 */
        }
      }

      function savePosition(force = false) {
        const now = Date.now();
        if (!force && now - state.lastPosSave < 3000) return;
        state.lastPosSave = now;
        store.set("siwon.position", { n: state.current, t: Math.floor(el.audio.currentTime || 0) });
      }

      const doneCount = () => Object.keys(state.plays).length;
      const levelOf = (c) => (c <= 0 ? 0 : c === 1 ? 1 : c <= 3 ? 2 : c <= 6 ? 3 : 4);

      /* ---------- 색 테마 ---------- */
      function applyTheme(n) {
        const target = hueOf(n);
        const cur = ((state.hue % 360) + 360) % 360;
        const delta = ((target - cur + 540) % 360) - 180; // 가장 가까운 방향으로 색 회전
        state.hue += delta;
        document.documentElement.style.setProperty("--h", state.hue.toFixed(2));
        if (el.themeColor) el.themeColor.setAttribute("content", `hsl(${Math.round(target)}, 30%, 9%)`);
      }

      /* ---------- 숫자 오도미터 ---------- */
      const reels = [];
      function buildOdometer() {
        const slots = String(MAX_TRACK).length;
        for (let i = 0; i < slots; i += 1) {
          const slot = document.createElement("span");
          slot.className = "slot";
          const reel = document.createElement("span");
          reel.className = "reel";
          reel.style.transitionDelay = `${i * 70}ms`;
          for (let d = 0; d < 10; d += 1) {
            const digit = document.createElement("span");
            digit.textContent = String(d);
            reel.appendChild(digit);
          }
          slot.appendChild(reel);
          el.artNum.appendChild(slot);
          reels.push({ slot, reel });
        }
      }

      function setOdometer(n) {
        const str = String(n).padStart(reels.length, "0");
        const lead = reels.length - String(n).length;
        reels.forEach(({ slot, reel }, i) => {
          reel.style.transform = `translateY(-${Number(str[i]) * 10}%)`;
          slot.classList.toggle("dim", i < lead);
        });
      }

      /* ---------- 현재 재생 화면 ---------- */
      function subText(n) {
        const c = state.plays[n] || 0;
        return c ? `${c}번 들었어요` : "아직 안 들었어요";
      }

      function renderNow(changed) {
        const n = state.current;
        el.trackTitle.textContent = `Pattern ${n}`;
        el.trackSub.textContent = subText(n);
        el.artRange.textContent = rangeLabel(rangeOf(n));
        el.artPos.textContent = `${n}/${MAX_TRACK}`;
        el.miniArt.textContent = String(n);
        el.miniTitle.textContent = `Pattern ${n}`;
        el.miniSub.textContent = `${subText(n)} · ${REPEAT_LABEL[state.repeat]}`;
        el.favBtn.setAttribute("aria-pressed", String(state.favs.has(n)));
        el.favBtn.setAttribute("aria-label", state.favs.has(n) ? "즐겨찾기 해제" : "즐겨찾기");
        el.prevBtn.disabled = n <= 1 && !(el.audio.currentTime > 3);
        el.nextBtn.disabled = n >= MAX_TRACK;
        el.miniNext.disabled = n >= MAX_TRACK;
        setOdometer(n);
        document.title = `Pattern ${n} · 시원스쿨 패턴 중국어`;

        if (changed) {
          el.art.classList.remove("sheen-run");
          void el.art.offsetWidth;
          el.art.classList.add("sheen-run");
        }
      }

      function renderSummary() {
        const done = doneCount();
        el.doneCount.textContent = String(done);
        el.ringFg.style.strokeDashoffset = String(100 - (done / MAX_TRACK) * 100);
      }

      function renderControls() {
        el.speedLabel.textContent = `${state.speed.toFixed(1)}×`;
        el.speedBtn.classList.toggle("on", state.speed !== 1);
        el.repeatIcon.setAttribute("href", `#i-repeat-${state.repeat}`);
        el.repeatLabel.textContent = REPEAT_LABEL[state.repeat];
        el.repeatBtn.setAttribute("aria-label", `반복 방식: ${REPEAT_LABEL[state.repeat]}`);
        el.repeatBtn.title = REPEAT_LABEL[state.repeat];
        el.repeatBtn.classList.toggle("on", state.repeat !== "off");
        el.miniSub.textContent = `${subText(state.current)} · ${REPEAT_LABEL[state.repeat]}`;
      }

      /* ---------- 진행바 ---------- */
      let lastCur = "";
      let lastRemain = "";
      function paintProgress() {
        const d = el.audio.duration;
        const hasDur = Number.isFinite(d) && d > 0;
        let t = el.audio.currentTime || 0;
        if (state.dragging) t = state.dragTime;
        else if (state.pendingSeek !== null) t = state.pendingSeek;
        const ratio = hasDur ? Math.min(1, t / d) : 0;

        el.scrubFill.style.transform = `scaleX(${ratio})`;
        el.miniFill.style.transform = `scaleX(${ratio})`;

        const cur = fmt(t);
        const remain = hasDur ? `-${fmt(d - t)}` : "--:--";
        if (cur !== lastCur) {
          el.timeCur.textContent = cur;
          lastCur = cur;
        }
        if (remain !== lastRemain) {
          el.timeRemain.textContent = remain;
          lastRemain = remain;
        }
        el.scrubber.setAttribute("aria-valuenow", String(Math.round(ratio * 100)));
        el.scrubber.setAttribute("aria-valuetext", hasDur ? `${cur} / ${fmt(d)}` : cur);
      }

      let rafId = 0;
      function loop() {
        paintProgress();
        rafId = requestAnimationFrame(loop);
      }

      function startLoop() {
        if (!rafId) rafId = requestAnimationFrame(loop);
      }

      function stopLoop() {
        cancelAnimationFrame(rafId);
        rafId = 0;
        paintProgress();
      }

      /* ---------- 구간 탭 & 잔디 그리드 ---------- */
      let indicator;
      function renderTabs() {
        el.tabs.innerHTML = "";
        indicator = document.createElement("span");
        indicator.className = "tab-indicator";
        el.tabs.appendChild(indicator);

        RANGES.forEach((_, i) => {
          const tab = document.createElement("button");
          tab.type = "button";
          tab.className = "tab";
          tab.setAttribute("role", "tab");
          tab.dataset.tab = String(i);
          tab.innerHTML = `<span>${rangeLabel(i)}</span><span class="tab-bar"><i></i></span>`;
          el.tabs.appendChild(tab);
        });

        const fav = document.createElement("button");
        fav.type = "button";
        fav.className = "tab tab-fav";
        fav.setAttribute("role", "tab");
        fav.dataset.tab = "fav";
        fav.innerHTML = `<span>★ <b class="fav-count">0</b></span><span class="tab-bar"></span>`;
        fav.setAttribute("aria-label", "즐겨찾기");
        el.tabs.appendChild(fav);
      }

      function paintTabs() {
        el.tabs.querySelectorAll(".tab").forEach((tab) => {
          const key = tab.dataset.tab === "fav" ? "fav" : Number(tab.dataset.tab);
          tab.setAttribute("aria-selected", String(key === state.tab));
          if (key === "fav") {
            tab.querySelector(".fav-count").textContent = String(state.favs.size);
            return;
          }
          const [a, b] = RANGES[key];
          let done = 0;
          for (let n = a; n <= b; n += 1) if (state.plays[n]) done += 1;
          tab.querySelector(".tab-bar i").style.setProperty("--p", `${(done / (b - a + 1)) * 100}%`);
          tab.setAttribute("aria-label", `${a}번부터 ${b}번, ${done}개 들음`);
        });
      }

      function moveIndicator(smoothScroll = true) {
        const active = el.tabs.querySelector('.tab[aria-selected="true"]');
        if (!active || !indicator) return;
        indicator.style.width = `${active.offsetWidth}px`;
        indicator.style.transform = `translateX(${active.offsetLeft}px)`;
        const left = active.offsetLeft - (el.tabs.clientWidth - active.offsetWidth) / 2;
        el.tabs.scrollTo({ left, behavior: smoothScroll ? "smooth" : "auto" });
      }

      function tracksForTab() {
        if (state.tab === "fav") return [...state.favs].sort((a, b) => a - b);
        const [a, b] = RANGES[state.tab];
        return Array.from({ length: b - a + 1 }, (_, i) => a + i);
      }

      function paintCell(cell) {
        const n = Number(cell.dataset.track);
        const c = state.plays[n] || 0;
        const isCurrent = n === state.current;
        const isFav = state.favs.has(n);
        cell.dataset.level = String(levelOf(c));
        cell.classList.toggle("current", isCurrent);
        cell.classList.toggle("is-fav", isFav);
        cell.querySelector(".cell-count").textContent = c ? String(c) : "";
        cell.setAttribute("aria-current", isCurrent ? "true" : "false");
        cell.setAttribute(
          "aria-label",
          `패턴 ${n}, ${c ? `${c}번 들음` : "안 들음"}${isFav ? ", 즐겨찾기" : ""}${isCurrent ? ", 현재 패턴" : ""}`
        );
      }

      function paintCells() {
        el.grid.querySelectorAll(".cell").forEach(paintCell);
      }

      function renderGrid() {
        const list = tracksForTab();
        const fragment = document.createDocumentFragment();
        list.forEach((n, i) => {
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "cell";
          cell.dataset.track = String(n);
          cell.style.setProperty("--ch", hueOf(n).toFixed(1));
          cell.style.setProperty("--i", String(i));
          cell.innerHTML =
            `<span class="cell-num">${n}</span><span class="cell-count"></span>` +
            `<span class="cell-fav" aria-hidden="true">★</span>` +
            `<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>`;
          paintCell(cell);
          fragment.appendChild(cell);
        });
        el.grid.replaceChildren(fragment);
        el.emptyFav.hidden = !(state.tab === "fav" && list.length === 0);
      }

      function selectTab(tab) {
        if (tab === state.tab) return;
        state.tab = tab;
        paintTabs();
        moveIndicator();
        renderGrid();
      }

      /* ---------- 화면 전환 (폰: 플레이어 탭 / 패턴 탭) ---------- */
      const tabModeMQ = window.matchMedia("(max-width: 719px), (max-height: 559px)");

      function updateMini() {
        const show = tabModeMQ.matches && state.view === "list";
        el.mini.classList.toggle("show", show);
        el.mini.setAttribute("aria-hidden", String(!show));
        el.mini.inert = !show;
      }

      function setView(view, animate = true) {
        const prevView = document.body.dataset.view;
        if (prevView === "list" && tabModeMQ.matches) state.listScroll = window.scrollY;

        state.view = view === "list" ? "list" : "player";
        document.body.dataset.view = state.view;
        store.set("siwon.view", state.view);
        el.viewbar.querySelectorAll(".view-tab").forEach((tab) => {
          tab.setAttribute("aria-selected", String(tab.dataset.view === state.view));
        });
        updateMini();

        if (!tabModeMQ.matches || prevView === state.view) return;
        const section = state.view === "player" ? el.nowCard : el.library;
        if (animate) {
          section.classList.remove("view-in");
          void section.offsetWidth;
          section.classList.add("view-in");
        }
        window.scrollTo(0, state.view === "list" ? state.listScroll : 0);
        if (state.view === "list") moveIndicator(false);
      }

      /* ---------- 재생 ---------- */
      function play() {
        if (!el.audio.src) loadTrack(state.current);
        const p = el.audio.play();
        if (p && typeof p.catch === "function") {
          p.catch((err) => {
            if (err && err.name === "NotAllowedError") toast("재생 버튼을 한 번 더 눌러주세요");
          });
        }
      }

      function togglePlay() {
        if (el.audio.paused) play();
        else el.audio.pause();
      }

      function loadTrack(n, autoplay = false) {
        const prev = state.current;
        state.current = clampTrack(n);
        const url = trackUrl(state.current);
        const changed = el.audio.src !== url;

        if (changed) {
          if (el.audio.src) state.pendingSeek = null;
          el.audio.src = url;
          el.audio.defaultPlaybackRate = state.speed;
          el.audio.playbackRate = state.speed;
        }

        store.set("siwon.current", state.current);
        applyTheme(state.current);
        renderNow(prev !== state.current);
        followTab(prev);
        paintCells();
        paintProgress();
        updateMediaSession();

        if (autoplay) play();
      }

      // 보고 있던 구간을 넘어가면 탭이 따라간다 (화면 스크롤은 하지 않음)
      function followTab(prev) {
        if (state.tab === "fav") return;
        const next = rangeOf(state.current);
        if (state.tab === rangeOf(prev) && next !== state.tab) selectTab(next);
      }

      function prev() {
        if (el.audio.currentTime > 3) {
          el.audio.currentTime = 0;
          paintProgress();
          renderNow(false);
          return;
        }
        if (state.current > 1) loadTrack(state.current - 1, true);
      }

      function next() {
        if (state.current < MAX_TRACK) loadTrack(state.current + 1, true);
        else toast("마지막 패턴이에요");
      }

      function seekBy(sec) {
        const d = el.audio.duration;
        if (!Number.isFinite(d)) return;
        el.audio.currentTime = Math.min(d, Math.max(0, el.audio.currentTime + sec));
        paintProgress();
      }

      function toggleFav() {
        const n = state.current;
        const added = !state.favs.has(n);
        if (added) state.favs.add(n);
        else state.favs.delete(n);
        store.set("siwon.favs", [...state.favs]);

        el.favBtn.classList.remove("pop");
        void el.favBtn.offsetWidth;
        if (added) el.favBtn.classList.add("pop");

        renderNow(false);
        paintTabs();
        if (state.tab === "fav") renderGrid();
        else paintCells();
        toast(added ? `Pattern ${n} 즐겨찾기에 담았어요 ★` : "즐겨찾기에서 뺐어요");
      }

      function addPlay(n) {
        const first = !state.plays[n];
        state.plays[n] = (state.plays[n] || 0) + 1;
        store.set("siwon.plays", state.plays);
        renderNow(false);
        renderSummary();
        paintTabs();
        paintCells();

        if (first) {
          const r = rangeOf(n);
          const [a, b] = RANGES[r];
          let all = true;
          for (let i = a; i <= b; i += 1) if (!state.plays[i]) { all = false; break; }
          if (doneCount() === MAX_TRACK) toast("263개 패턴을 모두 들었어요! 🎉");
          else if (all) toast(`${rangeLabel(r)} 구간을 모두 들었어요 🎉`);
        }
      }

      /* ---------- 잠금화면 / 이어폰 컨트롤 ---------- */
      const artCache = new Map();
      function artworkFor(n) {
        if (artCache.has(n)) return artCache.get(n);
        let url = "";
        try {
          const size = 512;
          const canvas = document.createElement("canvas");
          canvas.width = size;
          canvas.height = size;
          const g = canvas.getContext("2d");
          const h = Math.round(hueOf(n));
          const lg = g.createLinearGradient(0, 0, size, size);
          lg.addColorStop(0, `hsl(${h}, 75%, 66%)`);
          lg.addColorStop(1, `hsl(${(h + 50) % 360}, 62%, 30%)`);
          g.fillStyle = lg;
          g.fillRect(0, 0, size, size);
          const rg = g.createRadialGradient(80, 50, 0, 80, 50, 380);
          rg.addColorStop(0, "rgba(255,255,255,0.4)");
          rg.addColorStop(1, "rgba(255,255,255,0)");
          g.fillStyle = rg;
          g.fillRect(0, 0, size, size);
          g.fillStyle = "#fff";
          g.font = "700 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
          g.fillText("PATTERN", 44, 74);
          g.font = "800 220px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
          g.fillText(String(n), 34, 470);
          url = canvas.toDataURL("image/png");
        } catch {
          url = "";
        }
        artCache.set(n, url);
        return url;
      }

      function updateMediaSession() {
        if (!("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
        const n = state.current;
        const art = artworkFor(n);
        navigator.mediaSession.metadata = new MediaMetadata({
          title: `Pattern ${n}`,
          artist: "시원스쿨 패턴 중국어",
          album: `${rangeLabel(rangeOf(n))} 구간`,
          artwork: art ? [{ src: art, sizes: "512x512", type: "image/png" }] : []
        });
      }

      function updatePositionState() {
        if (!("mediaSession" in navigator) || !navigator.mediaSession.setPositionState) return;
        const d = el.audio.duration;
        if (!Number.isFinite(d) || d <= 0) return;
        try {
          navigator.mediaSession.setPositionState({
            duration: d,
            playbackRate: el.audio.playbackRate || 1,
            position: Math.min(d, el.audio.currentTime || 0)
          });
        } catch {
          /* 일부 브라우저 미지원 */
        }
      }

      function bindMediaSession() {
        if (!("mediaSession" in navigator)) return;
        const handlers = {
          play: () => play(),
          pause: () => el.audio.pause(),
          previoustrack: () => prev(),
          nexttrack: () => next(),
          seekto: (details) => {
            if (Number.isFinite(details.seekTime)) el.audio.currentTime = details.seekTime;
            paintProgress();
          }
        };
        // seekbackward/seekforward는 일부러 등록하지 않음:
        // iOS에서 등록하면 잠금화면의 이전/다음 버튼이 10초 이동 버튼으로 바뀐다.
        for (const [action, fn] of Object.entries(handlers)) {
          try {
            navigator.mediaSession.setActionHandler(action, fn);
          } catch {
            /* 지원하지 않는 동작 */
          }
        }
      }

      /* ---------- 이벤트 ---------- */
      function bindEvents() {
        const a = el.audio;

        el.playBtn.addEventListener("click", () => { haptic(); togglePlay(); });
        el.miniPlay.addEventListener("click", () => { haptic(); togglePlay(); });
        el.prevBtn.addEventListener("click", () => { haptic(); prev(); });
        el.nextBtn.addEventListener("click", () => { haptic(); next(); });
        el.miniNext.addEventListener("click", () => { haptic(); next(); });
        el.favBtn.addEventListener("click", () => { haptic(); toggleFav(); });
        el.miniInfo.addEventListener("click", () => { haptic(); setView("player"); });

        el.viewbar.addEventListener("click", (e) => {
          const tab = e.target.closest(".view-tab");
          if (!tab) return;
          haptic();
          setView(tab.dataset.view);
        });

        el.speedBtn.addEventListener("click", () => {
          haptic();
          state.speed = SPEEDS[(SPEEDS.indexOf(state.speed) + 1) % SPEEDS.length];
          a.defaultPlaybackRate = state.speed;
          a.playbackRate = state.speed;
          store.set("siwon.speed", state.speed);
          renderControls();
        });

        el.repeatBtn.addEventListener("click", () => {
          haptic();
          state.repeat = REPEAT_MODES[(REPEAT_MODES.indexOf(state.repeat) + 1) % REPEAT_MODES.length];
          store.set("siwon.repeat", state.repeat);
          store.set("siwon.continuous", state.repeat === "all");
          renderControls();
          toast(state.repeat === "all" ? "끝나면 다음 패턴으로 넘어가요" : state.repeat === "one" ? "지금 패턴을 계속 반복해요" : "이 패턴만 듣고 멈춰요");
        });

        el.tabs.addEventListener("click", (e) => {
          const tab = e.target.closest(".tab");
          if (!tab) return;
          haptic(5);
          selectTab(tab.dataset.tab === "fav" ? "fav" : Number(tab.dataset.tab));
        });

        el.grid.addEventListener("click", (e) => {
          const cell = e.target.closest(".cell");
          if (!cell) return;
          haptic();
          const n = Number(cell.dataset.track);
          if (n === state.current) togglePlay();
          else loadTrack(n, true);
        });

        el.locateBtn.addEventListener("click", () => {
          if (state.tab !== "fav" || !state.favs.has(state.current)) selectTab(rangeOf(state.current));
          requestAnimationFrame(() => {
            const cell = el.grid.querySelector(`.cell[data-track="${state.current}"]`);
            if (cell) cell.scrollIntoView({ block: "center", behavior: "smooth" });
          });
        });

        // 진행바 드래그
        const ratioAt = (e) => {
          const r = el.scrubber.getBoundingClientRect();
          return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        };
        const endDrag = () => {
          if (!state.dragging) return;
          state.dragging = false;
          el.scrubber.classList.remove("dragging");
          a.currentTime = state.dragTime;
          paintProgress();
          updatePositionState();
        };
        el.scrubber.addEventListener("pointerdown", (e) => {
          const d = a.duration;
          if (!Number.isFinite(d) || d <= 0) return;
          state.dragging = true;
          state.dragTime = ratioAt(e) * d;
          el.scrubber.setPointerCapture(e.pointerId);
          el.scrubber.classList.add("dragging");
          paintProgress();
        });
        el.scrubber.addEventListener("pointermove", (e) => {
          if (!state.dragging) return;
          state.dragTime = ratioAt(e) * a.duration;
          paintProgress();
        });
        el.scrubber.addEventListener("pointerup", endDrag);
        el.scrubber.addEventListener("pointercancel", endDrag);
        el.scrubber.addEventListener("lostpointercapture", endDrag);

        // PC 단축키 (한글 입력 상태에서도 동작하도록 e.code 사용)
        document.addEventListener("keydown", (e) => {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          const t = e.target;
          if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
          switch (e.code) {
            case "Space":
              if (t && t.closest && t.closest("button")) return;
              e.preventDefault();
              togglePlay();
              break;
            case "ArrowLeft":
              if (t && t.closest && t.closest(".tabs")) return;
              e.preventDefault();
              seekBy(-SEEK_STEP);
              break;
            case "ArrowRight":
              if (t && t.closest && t.closest(".tabs")) return;
              e.preventDefault();
              seekBy(SEEK_STEP);
              break;
            case "KeyN":
              next();
              break;
            case "KeyP":
              prev();
              break;
            case "KeyF":
              toggleFav();
              break;
            default:
          }
        });

        // 오디오 상태
        let pauseTimer = 0;
        a.addEventListener("play", () => {
          clearTimeout(pauseTimer);
          document.body.classList.add("is-playing");
          el.playBtn.setAttribute("aria-label", "일시정지");
          if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
          startLoop();
        });

        a.addEventListener("pause", () => {
          // 다음 트랙으로 넘어갈 때 잠깐 멈춤 상태가 깜빡이지 않도록 살짝 늦춘다
          clearTimeout(pauseTimer);
          pauseTimer = setTimeout(() => {
            if (a.paused) document.body.classList.remove("is-playing");
          }, 180);
          document.body.classList.remove("is-loading");
          el.playBtn.setAttribute("aria-label", "재생");
          if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
          stopLoop();
          savePosition(true);
        });

        a.addEventListener("waiting", () => document.body.classList.add("is-loading"));
        a.addEventListener("loadstart", () => {
          if (!a.paused) document.body.classList.add("is-loading");
        });
        a.addEventListener("playing", () => document.body.classList.remove("is-loading"));
        a.addEventListener("canplay", () => document.body.classList.remove("is-loading"));

        a.addEventListener("loadedmetadata", () => {
          a.playbackRate = state.speed;
          if (state.pendingSeek !== null) {
            a.currentTime = Math.min(state.pendingSeek, Math.max(0, a.duration - 1));
            state.pendingSeek = null;
          }
          paintProgress();
          updatePositionState();
        });

        a.addEventListener("timeupdate", () => {
          if (!rafId) paintProgress();
          el.prevBtn.disabled = state.current <= 1 && !(a.currentTime > 3);
          savePosition();
        });

        a.addEventListener("ratechange", updatePositionState);
        a.addEventListener("seeked", updatePositionState);

        a.addEventListener("ended", () => {
          addPlay(state.current);
          store.set("siwon.position", { n: state.current, t: 0 });

          if (state.repeat === "one") {
            a.currentTime = 0;
            play();
            return;
          }
          if (state.repeat === "all" && state.current < MAX_TRACK) {
            loadTrack(state.current + 1, true);
            return;
          }
          if (state.current >= MAX_TRACK && state.repeat === "all") toast("마지막 패턴까지 다 들었어요 🎉");
        });

        a.addEventListener("error", () => {
          if (!a.src) return;
          document.body.classList.remove("is-loading", "is-playing");
          toast("오디오를 불러오지 못했어요. 네트워크를 확인해주세요");
        });

        window.addEventListener("pagehide", () => savePosition(true));
        window.addEventListener("resize", () => moveIndicator(false));
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => moveIndicator(false));

        const onModeChange = () => {
          updateMini();
          moveIndicator(false);
        };
        if (tabModeMQ.addEventListener) tabModeMQ.addEventListener("change", onModeChange);
        else if (tabModeMQ.addListener) tabModeMQ.addListener(onModeChange);
      }

      /* ---------- 시작 ---------- */
      function init() {
        buildOdometer();
        renderTabs();
        state.tab = rangeOf(state.current);

        if (savedPos && Number(savedPos.n) === state.current && Number(savedPos.t) > 2) {
          state.pendingSeek = Number(savedPos.t);
        }

        loadTrack(state.current, false);
        renderControls();
        renderSummary();
        paintTabs();
        renderGrid();
        setView(state.view, false);
        moveIndicator(false);
        bindMediaSession();
        bindEvents();
      }

      init();
    })();
  </script>
</body>
</html>
